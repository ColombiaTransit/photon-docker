# Photon voor Colombia, met de wekelijkse Colombia-dump van GraphHopper.
#
#   docker compose up -d                 # eerste start: dump downloaden en importeren, daarna server op :2322
#   docker compose logs -f photon
#
# Nieuwe data importeren: FORCE_IMPORT=true docker compose up -d photon
# (daarna weer zonder FORCE_IMPORT starten), of het volume photon-data verwijderen.
services:
  photon:
    image: mvanlaar/photon-docker:latest
    restart: unless-stopped
    ports:
      - "2322:2322"
    environment:
      JAVA_OPTS: "-Xmx6G"
      LANGUAGES: "es,en"
      COUNTRY_CODES: "co"
      FORCE_IMPORT: "${FORCE_IMPORT:-false}"
    volumes:
      - photon-data:/photon/photon_data

volumes:
  photon-data:
